<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가사영상 제작기 — 주소가 바뀌었습니다</title>

<!-- ① 바로 넘긴다 (브라우저가 알아서) -->
<meta http-equiv="refresh" content="0; url=https://60aimake.github.io/simple-lyric-scene-maker/">
<link rel="canonical" href="https://60aimake.github.io/simple-lyric-scene-maker/">
<meta name="robots" content="noindex">

<style>
  :root{ --초록:#0f9d63; --진초록:#2ecc8f; --남:#0a142d; --회:#5b6577; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f6f7f9; color:var(--남); padding:24px;
    font-family:"맑은 고딕","Malgun Gothic",system-ui,-apple-system,sans-serif;
  }
  .판{ background:#fff; border-radius:18px; padding:40px 32px; max-width:560px; width:100%;
       box-shadow:0 6px 28px rgba(10,20,45,.10); text-align:center; }
  h1{ font-size:28px; margin:0 0 14px; line-height:1.35; }
  p{ font-size:18px; line-height:1.7; margin:0 0 10px; color:var(--회); }
  .단추{
    display:inline-block; margin:26px 0 8px; padding:18px 30px;
    background:var(--초록); color:#fff; font-size:21px; font-weight:700;
    border-radius:12px; text-decoration:none;
  }
  .단추:hover{ background:var(--진초록); }
  .주소{ font-size:15px; color:var(--회); word-break:break-all; margin-top:6px; }
  .끝{ margin-top:26px; font-size:15px; color:var(--회); }
  @media (max-width:420px){ h1{font-size:23px} p{font-size:16px} .단추{font-size:18px} }
</style>
</head><body>

<div class="판">
  <h1>가사영상 제작기는<br>새 주소로 옮겼습니다</h1>
  <p>잠시 뒤 새 주소로 자동으로 넘어갑니다.</p>
  <p>안 넘어가면 아래를 눌러 주세요.</p>

  <a class="단추" href="https://60aimake.github.io/simple-lyric-scene-maker/">
    가사영상 제작기 열기
  </a>
  <div class="주소">60aimake.github.io/simple-lyric-scene-maker/</div>

  <p class="끝">도구는 그대로입니다. 주소만 바뀌었습니다.<br>
     즐겨찾기를 해두셨다면 새 주소로 바꿔 주세요.</p>
</div>

<script>
  /* ② meta refresh 가 막힌 환경을 위한 예비.
     replace 를 써서 뒤로가기가 이 쪽으로 되돌아오지 않게 한다. */
  location.replace("https://60aimake.github.io/simple-lyric-scene-maker/");
</script>
</body></html>
